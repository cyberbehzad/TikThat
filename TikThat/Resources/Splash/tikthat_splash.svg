<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- گرادینت بنفش و آبی اختصاصی تیک دت -->
    <linearGradient id="tikGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#8A4FFF" />
      <stop offset="100%" stop-color="#6200EA" />
    </linearGradient>

    <!-- افکت سایه ملایم نئونی -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- پس زمینه دایره‌ای کارت مرکزی -->
  <circle cx="256" cy="210" r="130" fill="#1E1E26" stroke="#2A2A38" stroke-width="4" />
  
  <!-- کادر رینگی گرادینت نئونی دور آیکون -->
  <circle cx="256" cy="210" r="128" fill="none" stroke="url(#tikGradient)" stroke-width="6" opacity="0.85" filter="url(#neonGlow)" />

  <!-- تیک مینیمال و اسپرت تیک دت -->
  <path d="M195 210 L238 255 L320 165" fill="none" stroke="url(#tikGradient)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

  <!-- تایپوگرافی TikThat در زیر آیکون -->
  <text x="256" y="405" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="900" letter-spacing="2" fill="#FFFFFF">Tik<tspan fill="#8A4FFF">That</tspan></text>

  <!-- زیرعنوان مینیمال -->
  <text x="256" y="440" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" letter-spacing="4" fill="#A0A0A0">TASK MANAGER</text>
</svg>